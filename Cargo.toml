[package]
name = "jero-arch-ssm"
description = "State-space and hybrid recurrent-transformer recipes (Mamba, Mamba2, RWKV6/7, Jamba, Zamba2, Granite, LFM2) for the SpacemiT K3 platform"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "LGPL-3.0-only WITH LGPL-3.0-linking-exception"
repository = "https://github.com/LMA1980/jero-arch-ssm"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unused_qualifications = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"

[dependencies]
jero-core = { version = "0.1.0", git = "https://github.com/LMA1980/jero-core.git", branch = "feat/m10-multimodal-runtime" }
jero-kernels-rvv = { version = "0.1.0", git = "https://github.com/LMA1980/jero-kernels-rvv.git", branch = "feat/m10-multimodal-runtime" }
rayon = "1.12"

[features]
default = ["with-kernels"]
with-kernels = []
